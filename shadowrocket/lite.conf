# ======= 各地区手动选择 ======= #
香港手动 = select,policy-regex-filter=(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$,select=0
台湾手动 = select,policy-regex-filter=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$,select=0
日本手动 = select,policy-regex-filter=(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$,select=0
狮城手动 = select,policy-regex-filter=(?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$,select=0
美国手动 = select,policy-regex-filter=(?=.*(美|US|(?i)States|American))^((?!(港|台|日|韩|新)).)*$,select=0
其他地区手动 = select,policy-regex-filter=(?i)^(?!.*(?:港|台|日|新|狮|獅|美|Hong|Taiwan|Japan|Singapore|States|American|(?:^|[^a-z])(?:HK|TW|JP|SG|US)(?:$|[^a-z])|网易|墨鱼)).+$,select=0

