# Nextin iOS Lite — 2026-10-01
# 在 Nextin「设置 -> 订阅模板覆写」导入，并绑定已有订阅；节点由 Nextin 注入。
# 本文件不是带节点的独立订阅。勿填入公开订阅密钥。
# 默认手选节点；不后台定时测速。地区组为空时 REJECT，可改选「全部节点」。
# 国外未细分服务统一走「漏网之鱼」（默认一键代理），国内域名/IP 直连。
# 不含全局 UDP 443 拦截；不修改 HTTPS 重写模块。
# 关闭嗅探后，不透明的纯 IP 流量依赖保留的 IP 规则及兜底分流。
# DNS 主干、IPv6 与原配置保持接近；MRS 规则集走「一键代理」下载。
# 实际 iOS 内存变化需手机验证，规则文件体积不等于运行内存。

# Nextin Lite 紧凑版：设置 → 订阅模板覆写，绑定已有订阅。
# 仅压缩排版与复用重复字段；规则顺序、组内节点顺序及参数保持原版。
x-nextin: {version: 1, mode: subscription-template}
proxies: []
mode: rule
ipv6: true
log-level: warning
unified-delay: true
tcp-concurrent: true
global-ua: clash.meta
profile: {store-selected: true}
sniffer: {enable: false}
hosts: {services.googleapis.cn: [services.googleapis.com]}

dns:
  enable: true
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: lru
  listen: '127.0.0.1:7874'
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: '2001:2::1/48'
  fake-ip-filter-mode: blacklist
  respect-rules: false
  fake-ip-filter: [+.lan, +.local, 'rule-set:add_direct_domain', 'rule-set:cn_domain']
  nameserver: [114.114.114.114, 223.5.5.5]

proxy-groups:
  - {name: 一键代理, type: select, proxies: [全部节点, 香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动, 国内直连]}
  - {name: AI, type: select, proxies: &choices1 [一键代理, 全部节点, 香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动, 国内直连]}
  - {name: YouTube, type: select, proxies: *choices1}
  - {name: Telegram, type: select, proxies: *choices1}
  - {name: Microsoft, type: select, proxies: &choices2 [国内直连, 一键代理, 全部节点, 香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动]}
  - {name: Apple, type: select, proxies: *choices2}
  - {name: 漏网之鱼, type: select, proxies: *choices1}
  - {name: 国内直连, type: select, proxies: [DIRECT], hidden: true}
  - {name: 全部节点, <<: &manual {type: select, include-all-proxies: true, exclude-filter: '(?i)(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|expire|traffic|DIRECT|直接连接)', empty-fallback: REJECT}}
  - {name: 香港-手动, <<: *manual, filter: '(?i)(香港|🇭🇰|\bHK\b|\bHKG\b|Hong\s?Kong)'}
  - {name: 台湾-手动, <<: *manual, filter: '(?i)(台湾|台灣|🇹🇼|\bTW\b|\bTPE\b|\bTSA\b|\bKHH\b|Taiwan|Taipei)'}
  - {name: 日本-手动, <<: *manual, filter: '(?i)(日本|🇯🇵|\bJP\b|Japan|Tokyo|\bNRT\b|\bHND\b|\bKIX\b|\bCTS\b|\bFUK\b)'}
  - {name: 新加坡-手动, <<: *manual, filter: '(?i)(新加坡|🇸🇬|\bSG\b|Singapore|\bSIN\b|\bXSP\b)'}
  - {name: 韩国-手动, <<: *manual, filter: '(?i)(韩国|韓國|首尔|首爾|🇰🇷|\bKR\b|Korea|Seoul|\bICN\b|\bGMP\b|\bPUS\b)'}
  - {name: 美国-手动, <<: *manual, filter: '(?i)(美国|美國|🇺🇸|\bUS\b|\bUSA\b|United States|America|\bSJC\b|\bJFK\b|\bLAX\b|\bSFO\b|\bSEA\b|\bIAD\b|\bORD\b|\bATL\b|\bDFW\b|\bMIA\b)'}
  - {name: 欧洲-手动, <<: *manual, filter: '(?i)(英国|德国|法国|荷兰|意大利|西班牙|瑞典|瑞士|芬兰|挪威|丹麦|奥地利|比利时|爱尔兰|波兰|葡萄牙|捷克|希腊|匈牙利|罗马尼亚|保加利亚|克罗地亚|塞浦路斯|爱沙尼亚|拉脱维亚|立陶宛|卢森堡|马耳他|斯洛伐克|斯洛文尼亚|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇮🇹|🇪🇸|🇸🇪|🇨🇭|🇫🇮|🇳🇴|🇩🇰|🇦🇹|🇧🇪|🇮🇪|🇵🇱|🇵🇹|🇨🇿|\bUK\b|\bGB\b|\bDE\b|\bFR\b|\bNL\b|\bLHR\b|\bFRA\b|\bAMS\b|\bCDG\b|\bMAD\b|\bBCN\b|\bFCO\b|\bMUC\b|\bBRU\b)'}

rules:
  - RULE-SET,private_domain,国内直连
  - RULE-SET,private_ip,国内直连,no-resolve
  - RULE-SET,games@cn_domain,国内直连
  - RULE-SET,ai-!cn_domain,AI
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,一键代理
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,apple_domain,Apple
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,add_direct_domain,国内直连
  - RULE-SET,cn_domain,国内直连
  - RULE-SET,cn_ip,国内直连,no-resolve
  - MATCH,漏网之鱼

rule-providers:
  private_domain: {<<: &mrs_domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: 一键代理}, path: ./rules/Nextin-Lite/private_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'}
  games@cn_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/games@cn_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games@cn.mrs'}
  ai-!cn_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/ai-!cn_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs'}
  youtube_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/youtube_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs'}
  google_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/google_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs'}
  telegram_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/telegram_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs'}
  microsoft_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/microsoft_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs'}
  apple_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/apple_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs'}
  add_direct_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/add_direct_domain.mrs, url: 'https://raw.githubusercontent.com/Seven1echo/Yaml/refs/heads/main/rules/Seven1_Direct_Domain.mrs'}
  cn_domain: {<<: *mrs_domain, path: ./rules/Nextin-Lite/cn_domain.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'}
  private_ip: {<<: &mrs_ip {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: 一键代理}, path: ./rules/Nextin-Lite/private_ip.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'}
  telegram_ip: {<<: *mrs_ip, path: ./rules/Nextin-Lite/telegram_ip.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs'}
  cn_ip: {<<: *mrs_ip, path: ./rules/Nextin-Lite/cn_ip.mrs, url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'}
